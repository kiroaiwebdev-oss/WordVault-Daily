<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="description" content="WordVault Daily — a polished daily 5-letter word guessing game. New word every day, streaks, themes, hints and more." />
  <title>WordVault Daily</title>
  <!-- Inline SVG favicon kills the /favicon.ico 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236aaa64'/%3E%3Ctext x='50%25' y='54%25' font-size='38' font-family='Arial,sans-serif' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'%3EW%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css?v=1" />
</head>
<body>
  <div id="app">
    <header id="hud"></header>

    <main id="view">
      <section id="home" class="view-screen"></section>

      <section id="play" class="view-screen hidden">
        <div id="message" class="message"></div>
        <div class="board-wrap">
          <div id="board"></div>
        </div>
        <div id="boosters" class="boosters"></div>
        <div id="keyboard"></div>
      </section>
    </main>

    <div id="overlay" class="overlay-root"></div>
    <div id="toasts" class="toasts"></div>
    <canvas id="fx" class="fx"></canvas>
  </div>

  <!-- Premium loading splash -->
  <div id="loading" class="loading">
    <div class="loading__logo">
      <span class="logo__word">WORD</span><span class="logo__vault">VAULT</span>
    </div>
    <div class="loading__track"><div id="loading-bar" class="loading__bar"></div></div>
    <div id="loading-tip" class="loading__tip">Loading…</div>
  </div>

  <noscript>
    <div style="padding:2rem;color:#fff;font-family:sans-serif;text-align:center">
      WordVault Daily needs JavaScript enabled to play.
    </div>
  </noscript>

  <!-- PLATFORM_SDK_PLACEHOLDER : build.mjs injects the portal SDK <script> here -->

  <script type="module" src="src/main.js?v=1"></script>
</body>
</html>
